server {
  listen 80;
  server_name _;
  client_max_body_size 12m;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/csv;
  root /usr/share/nginx/html;

  location /api/    { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_read_timeout 120s; }
  location /admin/  { proxy_pass http://backend:8000; proxy_set_header Host $host; }
  location /static/ { proxy_pass http://backend:8000; }
  location /media/  { proxy_pass http://backend:8000; }

  # The service worker and the page must never be cached, otherwise updates never reach the phones.
  location = /sw.js      { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location = /index.html { add_header Cache-Control "no-cache"; }
  location /assets/      { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location /             { try_files $uri /index.html; }
}
