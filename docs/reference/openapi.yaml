components:
  schemas:
    Account:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          maxLength: 150
          pattern: ^[\w.@+-]+$
        email:
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        full_name:
          type: string
          maxLength: 160
        title:
          type: string
          maxLength: 160
        role:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/RoleEnum'
          - $ref: '#/components/schemas/NullEnum'
        role_label:
          type: string
          readOnly: true
        zone:
          type: string
          nullable: true
        is_active:
          type: boolean
          default: true
        is_superuser:
          type: boolean
          default: false
        person_id:
          type: integer
          nullable: true
          description: Lier le compte à une fiche du personnel existante (import Excel)
        last_login:
          type: string
          format: date-time
          readOnly: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
      required:
      - date_joined
      - id
      - last_login
      - role_label
      - username
    AccountRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 150
          pattern: ^[\w.@+-]+$
        email:
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        full_name:
          type: string
          maxLength: 160
        title:
          type: string
          maxLength: 160
        role:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/RoleEnum'
          - $ref: '#/components/schemas/NullEnum'
        zone:
          type: string
          nullable: true
        is_active:
          type: boolean
          default: true
        is_superuser:
          type: boolean
          default: false
        password:
          type: string
          writeOnly: true
        person_id:
          type: integer
          nullable: true
          description: Lier le compte à une fiche du personnel existante (import Excel)
      required:
      - username
    ActionPlanTask:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        asset:
          type: string
          nullable: true
        frequency_label:
          type: string
          readOnly: true
        year:
          type: integer
          maximum: 2147483647
          minimum: 0
        code:
          type: string
          maxLength: 20
        section:
          type: string
          maxLength: 160
        title:
          type: string
          maxLength: 200
        frequency:
          $ref: '#/components/schemas/FrequencyEnum'
        start:
          type: string
          format: date
          nullable: true
        end:
          type: string
          format: date
          nullable: true
        duration_days:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        scheduled_dates:
          description: Jours cochés dans le calendrier (ISO)
        progress_pct:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,1})?$
          nullable: true
        status_note:
          type: string
          maxLength: 200
        comment:
          type: string
        order:
          type: integer
          maximum: 2147483647
          minimum: 0
        source_ref:
          type: string
          maxLength: 255
        flags: {}
      required:
      - frequency
      - frequency_label
      - id
      - title
      - year
    ActionPlanTaskRequest:
      type: object
      properties:
        asset:
          type: string
          minLength: 1
          nullable: true
        year:
          type: integer
          maximum: 2147483647
          minimum: 0
        code:
          type: string
          maxLength: 20
        section:
          type: string
          maxLength: 160
        title:
          type: string
          minLength: 1
          maxLength: 200
        frequency:
          $ref: '#/components/schemas/FrequencyEnum'
        start:
          type: string
          format: date
          nullable: true
        end:
          type: string
          format: date
          nullable: true
        duration_days:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        scheduled_dates:
          description: Jours cochés dans le calendrier (ISO)
        progress_pct:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,1})?$
          nullable: true
        status_note:
          type: string
          maxLength: 200
        comment:
          type: string
        order:
          type: integer
          maximum: 2147483647
          minimum: 0
        source_ref:
          type: string
          maxLength: 255
        flags: {}
      required:
      - frequency
      - title
      - year
    Asset:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        parent:
          type: string
          nullable: true
        zone:
          type: string
          nullable: true
        node:
