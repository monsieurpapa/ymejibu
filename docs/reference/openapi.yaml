          nullable: true
        type_label:
          type: string
          readOnly: true
        condition_label:
          type: string
          readOnly: true
        source_ref:
          type: string
          description: 'Origine Excel : fichier!feuille!cellule'
          maxLength: 255
        raw_label:
          type: string
          description: Libellé d'origine tel que saisi dans Excel
          maxLength: 255
        flags:
          description: Anomalies détectées à l'import (codes du rapport qualité)
        code:
          type: string
          maxLength: 30
        name:
          type: string
          maxLength: 200
        type:
          $ref: '#/components/schemas/TypeEnum'
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,7})?$
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,7})?$
          nullable: true
        altitude_m:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          nullable: true
        capacity_value:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        capacity_unit:
          type: string
          maxLength: 20
        power_kw:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          nullable: true
        head_m:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          nullable: true
        specs:
          type: string
