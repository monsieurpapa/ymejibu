          $ref: '#/components/schemas/ConditionEnum'
        install_date:
          type: string
          format: date
          nullable: true
        built_by:
          type: string
          maxLength: 120
        om_documents:
          type: string
          maxLength: 255
        maintenance_frequency_days:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        last_maintenance:
          type: string
          format: date
          nullable: true
        next_maintenance:
          type: string
          format: date
          nullable: true
