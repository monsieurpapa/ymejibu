      - PIPE_BURST
      - RESERVOIR_OVERFLOW
      - NETWORK_FLUSH
      - DRAINING
      - RESERVOIR_CLEANING
      - FIREFIGHTING
      - ILLEGAL_BRANCH
      - FAULTY_METER
      - MISCALIBRATED_METER
      - ILLEGAL_CONNECTION
      - READING_ERROR
      - UNBILLED_CONSUMPTION
      type: string
      description: |-
        * `PIPE_LEAK` - Fuites physiques sur les conduites
        * `PIPE_BURST` - Ruptures de conduites
        * `RESERVOIR_OVERFLOW` - Débordements de réservoirs (trop-plein)
        * `NETWORK_FLUSH` - Purges du réseau
        * `DRAINING` - Vidanges
        * `RESERVOIR_CLEANING` - Eau utilisée pour le nettoyage des réservoirs
        * `FIREFIGHTING` - Eau utilisée pour la lutte contre les incendies
        * `ILLEGAL_BRANCH` - Branchements illégaux
        * `FAULTY_METER` - Compteurs défectueux
        * `MISCALIBRATED_METER` - Compteurs mal calibrés
        * `ILLEGAL_CONNECTION` - Connexions illégales
        * `READING_ERROR` - Erreurs de relevé
        * `UNBILLED_CONSUMPTION` - Volumes consommés mais non facturés
