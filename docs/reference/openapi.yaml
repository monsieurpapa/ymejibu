openapi: 3.0.3
info:
  title: API Yme Jibu E&M
  version: 0.1.0
  description: 'API de la plateforme d''Exploitation & Maintenance du réseau d''eau
    Goma Ouest. Authentification : en-tête `Authorization: Token <jeton>` obtenu par
    `POST /api/auth/login/`. Toutes les données sont limitées au site de l''utilisateur
    ; les droits dépendent de son rôle (voir docs/reference/roles.md).'
paths:
